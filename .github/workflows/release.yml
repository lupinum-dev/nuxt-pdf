name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and produce artifacts without publishing
        required: true
        type: boolean
        default: true
      tag:
        description: npm dist-tag
        required: true
        type: choice
        options: [next, latest]
        default: next

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Create release evidence
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          node scripts/generate-sbom.mjs release-artifacts/nuxt-pdf.cdx.json
          node scripts/generate-license-inventory.mjs release-artifacts/third-party-licenses.json
          cd release-artifacts
          sha256sum *.tgz nuxt-pdf.cdx.json third-party-licenses.json > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-release-evidence
          path: release-artifacts
      - name: Validate npm publication
        if: inputs.dry_run
        run: npm publish release-artifacts/*.tgz --dry-run --tag "${{ inputs.tag }}"
      - name: Publish with npm provenance
        if: ${{ !inputs.dry_run }}
        run: npm publish release-artifacts/*.tgz --provenance --access public --tag "${{ inputs.tag }}"
