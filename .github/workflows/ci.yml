name: ci

on:
  pull_request:
  push:
    branches: [main]
  # In libraries, release.yml starts this workflow on the Version packages PR,
  # because pull requests opened with GITHUB_TOKEN trigger no workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the `verify` script in package.json.
        task: [lint, typecheck, 'test:docs', test, 'test:production', build, audit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # lint compares the pull request with origin/main.
          fetch-depth: ${{ matrix.task == 'lint' && '0' || '1' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - if: matrix.task != 'audit'
        run: pnpm install --frozen-lockfile
      - if: matrix.task != 'audit' && matrix.task != 'build'
        run: pnpm ${{ matrix.task }}
      # The packed-package checks install the tarball of `pnpm build` into fresh Nuxt apps.
      - if: matrix.task == 'build'
        run: pnpm build && pnpm test:api && pnpm test:packed
      # Only production advisories that reach a published package block releases.
      - if: matrix.task == 'audit'
        run: node scripts/audit-deps.mjs

  # The supported Node floor and the newest supported Node major.
  node:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 26.5.0]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Raster baselines depend on the platform's font rendering, so they run in a pinned image.
  raster:
    name: raster (pinned Linux)
    runs-on: ubuntu-24.04
    container:
      image: node:24.11.1-bookworm@sha256:9a2ed90cd91b1f3412affe080b62e69b057ba8661d9844e143a6bbd76a23260f
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - name: Run raster and geometry suites
        run: >-
          pnpm exec vitest run
          test/annual-playground.test.ts
          test/certificate-playground.test.ts
          test/conformance.test.ts
          test/ebook-playground.test.ts
          test/menu-playground.test.ts
          test/pdf-utils.test.ts
          test/svg-conformance.test.ts
          test/test-utils-public.test.ts
          test/toc-conformance.test.ts
      - run: pnpm test:raster
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pdf-raster-diagnostics
          path: reports/pdf-snapshots
          if-no-files-found: ignore

  windows:
    name: test (Windows paths and assets)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:prepare
      - run: pnpm exec vitest run test/assets.test.ts test/build.test.ts test/fonts.test.ts test/layers.test.ts test/pdf-sfc-plugin.test.ts

  # The one required status check for the main branch ruleset.
  ci:
    name: ci
    if: always()
    needs: [check, node, raster, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do test "$result" = success; done
