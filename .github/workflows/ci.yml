name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  quality:
    name: Quality and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned Action commits
        run: node scripts/verify-action-shas.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.21.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|types|build|docs|test|ci|chore)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: .+'
          [[ "$PR_TITLE" =~ $pattern ]] || {
            echo 'Use a Conventional Commit pull request title, for example: fix(runtime): reject invalid images'
            exit 1
          }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:docs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm test:version-headings
      - run: pnpm test:workflows
      - run: pnpm test:dependencies
      - run: pnpm build && pnpm test:package-metadata

  core:
    name: Core (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 24.18.0, 26.5.0]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@11.21.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  raster:
    name: Pinned Linux raster evidence
    runs-on: ubuntu-24.04
    container:
      image: node:24.11.1-bookworm@sha256:9a2ed90cd91b1f3412affe080b62e69b057ba8661d9844e143a6bbd76a23260f
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: npm install --global pnpm@11.21.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-raster-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - name: Run raster and geometry suites
        run: >-
          pnpm exec vitest run
          test/annual-playground.test.ts
          test/certificate-playground.test.ts
          test/conformance.test.ts
          test/ebook-playground.test.ts
          test/menu-playground.test.ts
          test/pdf-utils.test.ts
          test/svg-conformance.test.ts
          test/test-utils-public.test.ts
          test/toc-conformance.test.ts
      - run: pnpm test:raster
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pdf-raster-diagnostics
          path: reports/pdf-snapshots
          if-no-files-found: ignore

  nuxt-integration:
    name: Nuxt production and serverless
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.21.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-nuxt-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:production
      - run: pnpm test:serverless
      - run: pnpm dev:build

  windows:
    name: Windows paths and assets
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:prepare
      - run: pnpm exec vitest run test/assets.test.ts test/build.test.ts test/fonts.test.ts test/layers.test.ts test/pdf-sfc-plugin.test.ts

  package:
    name: Exact installable artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.21.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-package-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:package-metadata
      - name: Certify the exact release candidate
        run: |
          node scripts/check-release-artifact.mjs release-artifacts
          version="$(node -p "require('./package.json').version")"
          node scripts/write-release-notes.mjs "$version" release-artifacts/release-notes.md
          test -s release-artifacts/release-notes.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Current dependency compatibility (${{ matrix.label }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pinned
            nuxt: 4.4.8
            vue: 3.5.0
            pdfjs: 5.6.205
            canvas: 0.1.97
          - label: latest supported
            nuxt: ^4.4.8
            vue: ^3.5.0
            pdfjs: ^5.6.205
            canvas: ^0.1.97
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Select supported dependency boundary
        run: >-
          pnpm add --workspace-root --save-dev
          nuxt@${{ matrix.nuxt }}
          vue@${{ matrix.vue }}
          pdfjs-dist@${{ matrix.pdfjs }}
          @napi-rs/canvas@${{ matrix.canvas }}
      - run: pnpm typecheck
      - run: pnpm test:production

  stress:
    name: Scheduled isolation and soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/isolation-stress.test.ts
      - run: NUXT_PDF_PERF_GATE=1 pnpm test:performance
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: performance-report
          path: reports/performance.json
          if-no-files-found: error
