name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  PNPM_STORE_DIR: ${{ github.workspace }}/.pnpm-store

jobs:
  quality:
    name: Quality and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm test:docs
      - run: pnpm test:version-headings
      - run: pnpm test:dependencies
      - run: pnpm build && pnpm test:package-metadata

  core:
    name: Core (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 24.11.1, 26.x]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
      - run: pnpm test

  raster:
    name: Pinned Linux raster evidence
    runs-on: ubuntu-24.04
    container:
      image: node:24.11.1-bookworm@sha256:9a2ed90cd91b1f3412affe080b62e69b057ba8661d9844e143a6bbd76a23260f
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-raster-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
      - name: Run raster and geometry suites
        run: >-
          pnpm exec vitest run
          test/annual-playground.test.ts
          test/certificate-playground.test.ts
          test/conformance.test.ts
          test/ebook-playground.test.ts
          test/menu-playground.test.ts
          test/pdf-utils.test.ts
          test/svg-conformance.test.ts
          test/test-utils-public.test.ts
          test/toc-conformance.test.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pdf-raster-diagnostics
          path: reports/pdf-snapshots
          if-no-files-found: ignore

  nuxt-integration:
    name: Nuxt production and serverless
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-nuxt-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
      - run: pnpm test:production
      - run: pnpm test:serverless
      - run: pnpm dev:build

  windows:
    name: Windows paths and assets
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/assets.test.ts test/build.test.ts test/fonts.test.ts test/layers.test.ts test/pdf-sfc-plugin.test.ts

  package:
    name: Exact installable artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-package-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
      - run: pnpm build
      - run: pnpm test:package-metadata
      - run: pnpm test:artifact

  compatibility:
    name: Current dependency compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - nuxt: 4.4.8
            vue: 3.5.0
            pdfjs: 5.6.205
            canvas: 0.1.97
          - nuxt: latest
            vue: latest
            pdfjs: latest
            canvas: latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - name: Select supported dependency boundary
        run: >-
          pnpm add --save-dev
          nuxt@${{ matrix.nuxt }}
          vue@${{ matrix.vue }}
          pdfjs-dist@${{ matrix.pdfjs }}
          @napi-rs/canvas@${{ matrix.canvas }}
      - run: pnpm test:types
      - run: pnpm test:production

  stress:
    name: Scheduled isolation and soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/isolation-stress.test.ts
      - run: NUXT_PDF_PERF_GATE=1 pnpm test:performance
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: performance-report
          path: reports/performance.json
          if-no-files-found: error
