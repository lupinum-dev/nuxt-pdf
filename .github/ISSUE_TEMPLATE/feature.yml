name: Feature request
description: Describe a user problem that Nuxt PDF can solve.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Open this issue before you start a large change. Keep the request focused on the user problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: This request stays within server-side PDF authoring for Nuxt.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain who has the problem and what they cannot do now.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result. Do not require one implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current alternatives
      description: Explain how users solve the problem now.
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: List compatibility, security, or migration concerns that the project must consider.
