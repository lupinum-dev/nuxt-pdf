name: Bug report
description: Report a reproducible defect in Nuxt PDF.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not include credentials, private documents, or private URLs.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: I can reproduce this problem with the latest Nuxt PDF release.
          required: true
        - label: This report does not contain sensitive information.
          required: true
  - type: input
    id: version
    attributes:
      label: Nuxt PDF version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and Node, Nuxt, and Vue versions.
      placeholder: macOS 15, Node 24.18.0, Nuxt 4.4.8, Vue 3.5.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link to a small public repository or provide the smallest safe example.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Render ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add safe logs, screenshots, or related links when they help.
