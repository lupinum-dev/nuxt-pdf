packages:
  - playground
  - docs

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# Reviewed first-party releases required by the docs app.
# Remove these exceptions after 2026-08-14 17:36 Europe/Vienna.
minimumReleaseAgeExclude:
  - '@lupinum/ginko-content@0.4.0-rc.2'
  - '@lupinum/ginko-docs@0.3.0-rc.5'
trustLockfile: false
blockExoticSubdeps: true
storeDir: .pnpm-store

overrides:
  # Security floors for transitive build and documentation dependencies.
  # Remove an override after every parent resolves a patched version. Review after 2026-09-01.
  '@hono/node-server': 1.19.15
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  esbuild: 0.28.1
  fast-uri: 3.1.5
  hono: 4.12.34
  ip-address: 10.3.1
  js-yaml: 4.3.1
  nanoid: 3.3.18
  postcss: 8.5.23
  tar: 7.5.22
  # Review by 2026-09-01. Remove when ipx and nuxt-og-image accept sharp 0.35.
  sharp: 0.35.3

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
