packages:
  - playground
  - docs

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Exact first-party prerelease certified in lupinum-dev/ginko-docs Actions run
# 33624551862. Remove after 2026-09-03 14:00 Europe/Vienna.
minimumReleaseAgeExclude:
  - '@lupinum/ginko-docs@0.4.0-rc.8'
trustLockfile: false
blockExoticSubdeps: true
storeDir: .pnpm-store

overrides:
  # Security floors for transitive build and documentation dependencies.
  # Remove an override after every parent resolves a patched version. Review after 2026-09-01.
  '@hono/node-server': 1.19.15
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  browserslist: 4.28.7
  esbuild: 0.28.1
  # URI parser security floor. Remove once all parents resolve >=3.1.6; review 2026-10-03.
  fast-uri: 3.1.6
  hono: 4.12.34
  ip-address: 10.3.1
  js-yaml: 4.3.1
  nanoid: 3.3.18
  postcss: 8.5.23
  tar: 7.5.22
  # Review by 2026-09-01. Remove when ipx and nuxt-og-image accept sharp 0.35.
  sharp: 0.35.3

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
